# DataVest local/product override for the QuantDinger-first stack.
# From this monorepo root:
#   docker compose -f backend/docker-compose.yml -f backend/docker-compose.datavest.yml -f backend/docker-compose.production.yml up --build
# Override DATAVEST_FRONTEND_SRC_PATH when the frontend is not at the default
# sibling `frontend/` path in this monorepo.

name: datavest

services:
  migration:
    image: datavest-backend:${DATAVEST_RELEASE:-local}
    container_name: datavest-migration

  postgres:
    container_name: datavest-postgres
    # Keep the local quantitative workspace isolated from other PostgreSQL
    # projects on the same machine.  Production does not publish this port.
    ports: !override
      - "${DATAVEST_DB_PORT:-127.0.0.1:5433}:5432"

  redis:
    container_name: datavest-redis

  redis-jobs:
    container_name: datavest-redis-jobs

  backend:
    image: datavest-backend:${DATAVEST_RELEASE:-local}
    container_name: datavest-backend
    environment:
      TZ: Asia/Ho_Chi_Minh
      SMART_INSIGHTS_AUTO_REFRESH: ${SMART_INSIGHTS_AUTO_REFRESH:-true}
      SMART_INSIGHTS_AUTO_REFRESH_SOURCE_CODES: ${SMART_INSIGHTS_AUTO_REFRESH_SOURCE_CODES:-datavest-market-bars,bitinfocharts-top-addresses,coinmetrics-community,coinglass-liquidation-maxpain,coinglass-margin-borrow,defillama-chains,defillama-stablecoins,mempool-space}
      DATAVEST_SMART_INSIGHTS_ENABLED: ${DATAVEST_SMART_INSIGHTS_ENABLED:-true}
      DATAVEST_PORTFOLIO_OPTIMIZER_ENABLED: ${DATAVEST_PORTFOLIO_OPTIMIZER_ENABLED:-true}
      DATAVEST_COMMUNITY_ENABLED: ${DATAVEST_COMMUNITY_ENABLED:-false}
      DATAVEST_TRADING_AGENTS_ENABLED: ${DATAVEST_TRADING_AGENTS_ENABLED:-false}
      DATAVEST_TRADING_AGENTS_SERVICE_URL: ${DATAVEST_TRADING_AGENTS_SERVICE_URL:-http://trading-agents:8080}
      DATAVEST_TRADING_AGENTS_CALLBACK_SECRET: ${DATAVEST_TRADING_AGENTS_CALLBACK_SECRET:-}
      STRATEGY_COMMANDS_ENABLED: "false"

  scheduler-worker:
    image: datavest-backend:${DATAVEST_RELEASE:-local}
    container_name: datavest-scheduler
    environment:
      TZ: Asia/Ho_Chi_Minh
      SMART_INSIGHTS_AUTO_REFRESH: ${SMART_INSIGHTS_AUTO_REFRESH:-true}
      SMART_INSIGHTS_AUTO_REFRESH_SOURCE_CODES: ${SMART_INSIGHTS_AUTO_REFRESH_SOURCE_CODES:-datavest-market-bars,bitinfocharts-top-addresses,coinmetrics-community,coinglass-liquidation-maxpain,coinglass-margin-borrow,defillama-chains,defillama-stablecoins,mempool-space}
      STRATEGY_COMMANDS_ENABLED: "false"

  celery-worker:
    image: datavest-backend:${DATAVEST_RELEASE:-local}
    container_name: datavest-celery-worker
    environment:
      TZ: Asia/Ho_Chi_Minh
      DATAVEST_TRADING_AGENTS_ENABLED: ${DATAVEST_TRADING_AGENTS_ENABLED:-false}
      DATAVEST_TRADING_AGENTS_SERVICE_URL: ${DATAVEST_TRADING_AGENTS_SERVICE_URL:-http://trading-agents:8080}
      DATAVEST_TRADING_AGENTS_SERVICE_SECRET: ${DATAVEST_TRADING_AGENTS_SERVICE_SECRET:-}
      SMART_INSIGHTS_AUTO_REFRESH: ${SMART_INSIGHTS_AUTO_REFRESH:-true}
      SMART_INSIGHTS_AUTO_REFRESH_SOURCE_CODES: ${SMART_INSIGHTS_AUTO_REFRESH_SOURCE_CODES:-datavest-market-bars,bitinfocharts-top-addresses,coinmetrics-community,coinglass-liquidation-maxpain,coinglass-margin-borrow,defillama-chains,defillama-stablecoins,mempool-space}
      STRATEGY_COMMANDS_ENABLED: "false"
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "jobs,ai,maintenance,trading-agents", "--concurrency=${CELERY_CONCURRENCY:-2}"]

  celery-beat:
    image: datavest-backend:${DATAVEST_RELEASE:-local}
    container_name: datavest-celery-beat
    environment:
      TZ: Asia/Ho_Chi_Minh
      SMART_INSIGHTS_AUTO_REFRESH: ${SMART_INSIGHTS_AUTO_REFRESH:-true}
      SMART_INSIGHTS_AUTO_REFRESH_SOURCE_CODES: ${SMART_INSIGHTS_AUTO_REFRESH_SOURCE_CODES:-datavest-market-bars,bitinfocharts-top-addresses,coinmetrics-community,coinglass-liquidation-maxpain,coinglass-margin-borrow,defillama-chains,defillama-stablecoins,mempool-space}
      STRATEGY_COMMANDS_ENABLED: "false"

  frontend:
    image: datavest-frontend:${DATAVEST_RELEASE:-local}
    pull_policy: build
    container_name: datavest-frontend
    build:
      context: ${DATAVEST_FRONTEND_SRC_PATH:-../frontend}
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0-local}
        GIT_TAG: ${DATAVEST_RELEASE:-local}

  # Full upstream TradingAgents executes only on the private Compose network.
  # It has no DataVest database credential and writes native checkpoints,
  # reports and memory only to this scoped named volume.
  trading-agents:
    profiles: ["trading-agents"]
    build:
      context: .
      dockerfile: trading_agents_service/Dockerfile
    image: datavest-trading-agents:${DATAVEST_RELEASE:-local}
    container_name: datavest-trading-agents
    restart: unless-stopped
    user: "10002:10002"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${TRADING_AGENTS_PIDS_LIMIT:-256}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${TRADING_AGENTS_TMPFS_SIZE:-128m}
    volumes:
      - trading_agents_state:/var/lib/tradingagents
    environment:
      TZ: Asia/Ho_Chi_Minh
      DATAVEST_TRADING_AGENTS_STATE_ROOT: /var/lib/tradingagents
      DATAVEST_TRADING_AGENTS_CALLBACK_URL: ${DATAVEST_TRADING_AGENTS_CALLBACK_URL:-http://backend:5000/api/internal/trading-agents/callback}
      DATAVEST_TRADING_AGENTS_CALLBACK_SECRET: ${DATAVEST_TRADING_AGENTS_CALLBACK_SECRET:-}
      DATAVEST_TRADING_AGENTS_SERVICE_SECRET: ${DATAVEST_TRADING_AGENTS_SERVICE_SECRET:-}
      TRADINGAGENTS_LLM_PROVIDER: ${TRADINGAGENTS_LLM_PROVIDER:-deepseek}
      TRADINGAGENTS_QUICK_THINK_LLM: ${TRADINGAGENTS_QUICK_THINK_LLM:-}
      TRADINGAGENTS_DEEP_THINK_LLM: ${TRADINGAGENTS_DEEP_THINK_LLM:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quantdinger-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/internal/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  trading_agents_state:
    driver: local
