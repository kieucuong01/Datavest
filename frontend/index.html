<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="/datavest-mark.svg">
    <title>DataVest</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .first-loading-wrp {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        color: #111827;
        background:
          linear-gradient(135deg, rgba(37, 99, 235, 0.08), rgba(20, 184, 166, 0.08)),
          #f8fbff;
      }

      .first-loading-card {
        width: 360px;
        max-width: calc(100% - 32px);
        display: grid;
        justify-items: center;
        gap: 18px;
        padding: 36px 34px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(16px);
      }

      .brand-mark {
        width: 104px;
        height: 104px;
        border-radius: 50%;
        object-fit: cover;
        filter: drop-shadow(0 18px 32px rgba(37, 99, 235, 0.18));
        animation: qdFloat 2.8s ease-in-out infinite;
      }

      .brand-title {
        margin: 2px 0 0;
        color: #0f172a;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .brand-subtitle {
        margin: 0;
        color: #64748b;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
      }

      .brand-attribution {
        margin: -10px 0 0;
        color: #94a3b8;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .loading-line {
        width: 220px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.12);
      }

      .loading-line::before {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #1d4ed8, #14b8a6);
        animation: qdLoad 1.15s ease-in-out infinite;
      }

      .loading-copy {
        margin: 0;
        color: #64748b;
        font-size: 13px;
      }

      @keyframes qdLoad {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }

      @keyframes qdFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @media (max-width: 640px) {
        .first-loading-wrp {
          padding: 16px;
        }

        .first-loading-card {
          width: 100%;
          max-width: calc(100% - 16px);
          padding: 30px 22px;
        }

        .brand-mark {
          width: 88px;
          height: 88px;
        }

        .brand-title {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>DataVest cần JavaScript để tải không gian nghiên cứu định lượng.</strong>
    </noscript>
    <div id="app">
      <div class="first-loading-wrp">
        <div class="first-loading-card">
          <img class="brand-mark" src="/datavest-mark.svg" alt="DataVest">
          <h2 class="brand-title">DataVest</h2>
          <p class="brand-subtitle">Không gian nghiên cứu định lượng</p>
          <p class="brand-attribution">Powered by DataVest</p>
          <div class="loading-line" aria-hidden="true"></div>
          <p class="loading-copy">Đang tải không gian làm việc...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
