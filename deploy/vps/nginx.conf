server {
    listen 80;
    listen [::]:80;
    server_name datavest.vn www.datavest.vn;
    location /.well-known/acme-challenge/ { root /var/www/datavest-acme; }
    location / { return 301 https://datavest.vn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name datavest.vn www.datavest.vn;
    ssl_certificate /etc/letsencrypt/live/datavest.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datavest.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/datavest/current/frontend/dist;
    index index.html;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }
    location = /api/health/workers { return 404; }
    location = /metrics { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_connect_timeout 15s;
        proxy_buffering off;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
